name: lifeflow_ai
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.7.1
  crypto: ^3.0.7
  firebase_analytics: ^12.4.5
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.4.3
  firebase_storage: ^13.4.5
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.0.1
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  percent_indicator: ^4.2.5
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.1.0
  table_calendar: ^3.2.0
  timezone: ^0.11.1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 800
