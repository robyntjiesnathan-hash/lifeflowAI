name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/lifeflow-ai-app-ohmv99

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable

      - run: flutter pub get

      - run: flutter build apk --release --split-per-abi --dart-define=USE_FAKE_AUTH=true

      - uses: actions/upload-artifact@v4
        with:
          name: lifeflow-ai-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Publish arm64 APK to apk-builds branch
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/app-arm64-v8a-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-builds
          git rm -rf . > /dev/null
          cp /tmp/app-arm64-v8a-release.apk lifeflow-ai.apk
          git add lifeflow-ai.apk
          git commit -m "APK build for ${{ github.sha }}"
          git push origin HEAD:apk-builds --force
